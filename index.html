<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>パチッとモンスター</title>

<style>
  
  /* =========================================================
   タイトルメニュー
========================================================= */

.titleMenuBtn{

  width:100%;

  margin:6px 0;

  padding:13px;

  border:3px solid #222;

  border-radius:10px;

  background:#fff;

  color:#222;

  font-weight:bold;

  font-size:
    clamp(16px,4.5vw,21px);

  box-shadow:
    0 3px 0 #333;

}

.titleMenuBtn:disabled{

  opacity:.45;

  cursor:not-allowed;

  box-shadow:none;

}

.saveStatus{

  margin:12px 0 0;

  color:#666;

  font-size:13px;

}

/* =========================================================
   基本
========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#111;
  color:#fff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button{
  font:inherit;
  touch-action:manipulation;
  cursor:pointer;
}

button:active{
  transform:translateY(2px);
}

/* =========================================================
   ゲーム本体
========================================================= */

#game{
  width:100vw;
  height:100vh;

  max-width:900px;

  margin:auto;

  position:relative;

  background:#72bb5c;

  overflow:hidden;
}

.screen{
  position:absolute;

  inset:0;

  display:none;
}

.screen.active{
  display:block;
}

/* =========================================================
   タイトル
========================================================= */

#titleScreen{

  background:
    radial-gradient(
      circle at 50% 30%,
      #fff 0,
      #ffe36e 8%,
      transparent 9%
    ),
    linear-gradient(
      #62b7e8,
      #9ee0ff 50%,
      #70c65a 50%
    );

  text-align:center;

  padding:30px 15px;

  overflow:auto;
}

.title{

  margin-top:7vh;

  font-size:
    clamp(42px,11vw,85px);

  font-weight:900;

  color:#fff;

  text-shadow:
    4px 4px 0 #333,
    -2px -2px 0 #333,
    2px -2px 0 #333,
    -2px 2px 0 #333;

  transform:rotate(-2deg);
}

.subtitle{

  margin-top:8px;

  font-size:
    clamp(16px,4vw,22px);

  font-weight:bold;

  color:#222;
}

.startBox{

  margin:35px auto 0;

  width:min(500px,94vw);

  background:#fff;

  color:#222;

  border:4px solid #222;

  border-radius:16px;

  padding:16px;

  box-shadow:0 7px 0 #333;
}

.startBox h2{

  margin:0 0 15px;

  font-size:
    clamp(18px,5vw,25px);
}

.starterButtons{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:7px;
}

.starterBtn{

  border:3px solid #222;

  background:#f7f7f7;

  color:#222;

  border-radius:11px;

  padding:10px 3px;

  font-size:
    clamp(13px,3.5vw,17px);

  font-weight:bold;
}

.starterBtn .icon{

  display:block;

  font-size:
    clamp(32px,10vw,45px);

  margin-bottom:3px;
}

/* =========================================================
   マップ
========================================================= */

#mapScreen{
  background:#72bb5c;
}

/* =========================================================
   HUD
========================================================= */

#hud{

  position:absolute;

  top:0;
  left:0;
  right:0;

  height:42px;

  z-index:50;

  background:rgba(20,20,20,.92);

  padding:
    5px 10px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  font-size:
    clamp(12px,3.3vw,15px);

  border-bottom:2px solid #111;
}

.hudLeft{

  display:flex;

  gap:10px;

  align-items:center;
}

.hudMoney{

  color:#ffe66d;

  font-weight:bold;
}

#mapName{
  font-weight:bold;
}

/* =========================================================
   マップエリア
========================================================= */

#mapArea{

  position:absolute;

  top:42px;
  left:0;
  right:0;

  bottom:166px;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

  padding:5px;
}

.mapGrid{

  display:grid;

  gap:1px;

  background:#333;

  border:4px solid #333;

  width:min(
    94vw,
    calc(100vh - 235px)
  );

  height:min(
    94vw,
    calc(100vh - 235px)
  );

  aspect-ratio:1 / 1;

  flex-shrink:0;
}

.tile{

  min-width:0;
  min-height:0;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:
    clamp(12px,4vw,28px);

  user-select:none;

  overflow:hidden;
}

.tile.grass{
  background:#78bd55;
}

.tile.road{
  background:#d7bd82;
}

.tile.water{
  background:#54aee0;
}

.tile.tree{
  background:#4b9b4a;
}

.tile.wall{
  background:#777;
}

.tile.building{
  background:#d98b57;
}

.tile.center{
  background:#f1e9df;
}

.tile.shop{
  background:#e8c34d;
}

.tile.exit{
  background:#d7bd82;
}

.tile.player{
  background:#d7bd82;
}

.mapPlayerIcon{

  font-size:
    clamp(17px,5vw,30px);

  z-index:2;
}

/* =========================================================
   マップメッセージ
========================================================= */

#message{

  position:absolute;

  left:8px;
  right:8px;

  bottom:171px;

  min-height:38px;

  max-height:58px;

  overflow:hidden;

  background:rgba(0,0,0,.82);

  border:2px solid #fff;

  border-radius:9px;

  padding:7px 9px;

  z-index:40;

  font-size:
    clamp(12px,3.5vw,15px);

  display:flex;

  align-items:center;
}

/* =========================================================
   操作エリア
========================================================= */

#controls{

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:166px;

  background:#222;

  border-top:4px solid #111;

  z-index:60;

  padding:8px;

}

/* =========================================================
   十字キー
========================================================= */

.dpad{

  position:absolute;

  left:10px;
  top:17px;

  width:126px;
  height:126px;
}

.dpad button{

  position:absolute;

  width:42px;
  height:42px;

  padding:0;

  border:2px solid #111;

  border-radius:7px;

  background:#ddd;

  color:#111;

  font-size:21px;

  font-weight:bold;

  box-shadow:
    0 2px 0 #000;
}

#up{
  left:42px;
  top:0;
}

#left{
  left:0;
  top:42px;
}

#right{
  right:0;
  top:42px;
}

#down{
  left:42px;
  bottom:0;
}

/* =========================================================
   メニューボタン
========================================================= */

.menuButtons{

  position:absolute;

  left:148px;
  right:8px;

  top:17px;

  height:126px;

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  grid-template-rows:
    repeat(2,1fr);

  gap:6px;
}

.menuButtons button{

  min-height:0;

  border:2px solid #111;

  border-radius:8px;

  background:#eee;

  color:#111;

  font-weight:bold;

  font-size:
    clamp(12px,3.7vw,16px);

  box-shadow:
    0 2px 0 #000;
}

/* =========================================================
   オーバーレイ
========================================================= */

.overlay{

  position:absolute;

  inset:0;

  background:
    rgba(0,0,0,.72);

  z-index:100;

  display:none;

  align-items:center;
  justify-content:center;

  padding:12px;
}

.overlay.active{
  display:flex;
}

.panel{

  width:min(700px,96vw);

  max-height:92vh;

  overflow:auto;

  background:#f5f5f5;

  color:#222;

  border:4px solid #222;

  border-radius:14px;

  padding:13px;

  box-shadow:
    0 8px 0 rgba(0,0,0,.4);
}

.panel h2{

  margin:0 0 12px;

  font-size:
    clamp(20px,5vw,28px);
}

.panel button{

  border:2px solid #222;

  border-radius:8px;

  background:#fff;

  color:#222;

  padding:9px;

  margin:3px;

}

.closeBtn{

  width:100%;

  background:#333 !important;

  color:#fff !important;

  margin-top:10px !important;
}

/* =========================================================
   パーティー
========================================================= */

.monsterList{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:7px;
}

.monsterCard{

  border:3px solid #333;

  border-radius:10px;

  padding:8px;

  background:#fff;

  min-height:100px;
}

.monsterCard.dead{
  opacity:.5;
}

.monsterIcon{

  font-size:35px;

  float:left;

  margin-right:8px;
}

.hpbar{

  height:11px;

  background:#ccc;

  border:1px solid #333;

  border-radius:6px;

  overflow:hidden;

  margin-top:5px;
}

.hpfill{

  height:100%;

  background:#48a848;

  transition:
    width .25s ease;
}

.small{
  font-size:12px;
}

/* =========================================================
   図鑑
========================================================= */

.dexGrid{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:6px;
}

.dexItem{

  border:2px solid #555;

  border-radius:8px;

  padding:7px;

  background:#fff;

  min-height:65px;
}

.dexUnknown{
  color:#888;
}

/* =========================================================
   BOX
========================================================= */

.boxTabs{

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:3px;

  margin-bottom:8px;
}

.boxTabs button{

  margin:0;

  padding:6px 2px;
}

.boxGrid{

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:5px;
}

.boxSlot{

  min-height:70px;

  border:2px solid #777;

  border-radius:7px;

  background:#ddd;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  cursor:pointer;
}

.boxSlot.occupied{

  background:#fff;

  border-color:#222;
}

.boxSlot .slotIcon{
  font-size:25px;
}

/* =========================================================
   戦闘画面
========================================================= */

#battleScreen{

  background:
    linear-gradient(
      #a7d8f2 0 48%,
      #82c56b 48% 100%
    );

  overflow:hidden;
}

/* =========================================================
   戦闘フィールド
========================================================= */

.battleField{

  position:absolute;

  top:0;
  left:0;
  right:0;

  bottom:175px;

  overflow:hidden;
}

/* =========================================================
   野生パチモン
========================================================= */

.battleEnemy{

  position:absolute;

  top:8%;

  right:7%;

  width:45%;

  z-index:10;

  display:flex;

  flex-direction:column;

  align-items:center;
}

#wildIcon{

  position:relative;

  font-size:
    clamp(65px,18vw,110px);

  line-height:1;

  margin-bottom:8px;

  order:1;
}

.battleTop{

  position:relative;

  top:auto;
  right:auto;

  width:100%;

  background:#fff;

  color:#222;

  border:3px solid #222;

  border-radius:10px;

  padding:7px;

  order:2;

  box-shadow:
    0 3px 0 rgba(0,0,0,.25);
}

.battleNameRow{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:5px;

  font-size:
    clamp(13px,4vw,17px);
}

/* =========================================================
   プレイヤー側
========================================================= */

.battlePlayer{

  position:absolute;

  left:7%;

  bottom:6%;

  width:48%;

  z-index:12;

  display:flex;

  flex-direction:column;

  align-items:center;
}

#playerIcon{

  position:relative;

  left:auto;
  bottom:auto;

  font-size:
    clamp(65px,18vw,105px);

  line-height:1;

  margin-bottom:8px;

  order:1;
}

.battleBottom{

  position:relative;

  left:auto;
  bottom:auto;

  width:100%;

  background:#fff;

  color:#222;

  border:3px solid #222;

  border-radius:10px;

  padding:7px;

  order:2;

  box-shadow:
    0 3px 0 rgba(0,0,0,.25);
}

/* =========================================================
   戦闘テキスト
========================================================= */

.battleText{

  position:absolute;

  left:8px;
  right:8px;

  bottom:180px;

  background:
    rgba(0,0,0,.88);

  color:#fff;

  border:2px solid #fff;

  border-radius:9px;

  padding:8px;

  z-index:30;

  min-height:45px;

  max-height:70px;

  overflow:auto;

  font-size:
    clamp(12px,3.5vw,15px);
}

/* =========================================================
   戦闘メニュー
========================================================= */

.battleMenu{

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:175px;

  background:#222;

  border-top:4px solid #111;

  padding:8px;

  z-index:25;
}

.battleButtons{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  grid-template-rows:
    repeat(2,1fr);

  gap:7px;

  height:100%;
}

.battleButtons button{

  padding:8px;

  border:2px solid #111;

  border-radius:9px;

  background:#eee;

  color:#111;

  font-weight:bold;

  font-size:
    clamp(14px,4vw,18px);

  box-shadow:
    0 2px 0 #000;
}

/* =========================================================
   技一覧
========================================================= */

.moveButton{

  width:100%;

  text-align:left;

  margin:4px 0 !important;

  padding:10px !important;

  display:block;
}

.moveName{

  font-weight:bold;

  font-size:16px;
}

.moveInfo{

  margin-top:3px;

  color:#555;

  font-size:12px;
}

/* =========================================================
   パチモン交換
========================================================= */

.switchList{

  display:grid;

  gap:6px;

  margin-top:8px;
}

.switchButton{

  width:100%;

  text-align:left;

  padding:10px !important;

  display:flex;

  align-items:center;

  gap:10px;

}

.switchIcon{

  font-size:35px;

  min-width:42px;

  text-align:center;
}

/* =========================================================
   ショップ
========================================================= */

.shopItems{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:8px;
}

.shopItem{

  border:3px solid #333;

  border-radius:10px;

  padding:10px;

  background:#fff;
}

.shopItem h3{

  margin:0 0 4px;
}

.price{

  color:#c88a00;

  font-weight:bold;
}

/* =========================================================
   モーダル
========================================================= */

.modalBox{

  width:min(600px,94vw);

  max-height:88vh;

  overflow:auto;

  background:#fff;

  color:#222;

  border:4px solid #222;

  border-radius:12px;

  padding:13px;
}

.modalButtons{

  display:grid;

  gap:5px;

  margin-top:10px;
}

/* =========================================================
   スマホ調整
========================================================= */

@media(max-width:500px){

  #controls{
    height:158px;
  }

  #mapArea{
    bottom:158px;
  }

  #message{
    bottom:163px;
  }

  .mapGrid{

    width:min(
      94vw,
      calc(100vh - 225px)
    );

    height:min(
      94vw,
      calc(100vh - 225px)
    );
  }

  .dpad{

    left:7px;
    top:14px;

    width:120px;
    height:120px;
  }

  .dpad button{

    width:40px;
    height:40px;
  }

  #up,
  #down{
    left:40px;
  }

  #left,
  #right{
    top:40px;
  }

  .menuButtons{

    left:137px;

    top:14px;

    height:120px;
  }

  .menuButtons button{

    font-size:13px;
  }

  .monsterList{
    grid-template-columns:1fr;
  }

  .dexGrid{
    grid-template-columns:1fr;
  }

  .shopItems{
    grid-template-columns:1fr;
  }

  .battleMenu{
    height:165px;
  }

  .battleField{
    bottom:165px;
  }

  .battleText{
    bottom:170px;
  }

  .battleEnemy{
    top:5%;
    right:5%;
    width:47%;
  }

  .battlePlayer{
    left:5%;
    bottom:5%;
    width:50%;
  }

  #wildIcon,
  #playerIcon{
    font-size:65px;
  }

}

/* =========================================================
   横幅が非常に狭い端末
========================================================= */

@media(max-width:360px){

  #controls{
    height:145px;
  }

  #mapArea{
    bottom:145px;
  }

  #message{
    bottom:150px;
  }

  .dpad{

    width:105px;
    height:105px;

    top:13px;
  }

  .dpad button{

    width:35px;
    height:35px;

    font-size:18px;
  }

  #up,
  #down{
    left:35px;
  }

  #left,
  #right{
    top:35px;
  }

  .menuButtons{

    left:120px;

    top:13px;

    height:105px;
  }

  .menuButtons button{
    font-size:11px;
  }

}

</style>
</head>

<body>

<div id="game">

<!-- =========================================================
     タイトル
========================================================= -->

<div id="titleScreen" class="screen active">

  <div class="title">
    パチモン
  </div>

  <div class="subtitle">
    パチッとモンスター
  </div>

  <div class="startBox" id="titleMenu">

  <h2>
    パチモンの世界へ！
  </h2>

  <button
    class="titleMenuBtn"
    id="continueBtn"
    onclick="continueGame()"
  >
    ▶ 続きから
  </button>

  <button
    class="titleMenuBtn"
    onclick="newGame()"
  >
    ▶ 初めから
  </button>

  <p
    id="saveStatus"
    class="saveStatus"
  ></p>

</div>

<!-- 初めから選択後のスターター選択 -->

<div
  class="startBox"
  id="starterSelect"
  style="display:none"
>

  <h2>
    最初のパチモンを選ぼう！
  </h2>

  <div class="starterButtons">

    <button
      class="starterBtn"
      onclick="chooseStarter(1)"
    >
      <span class="icon">🐣</span>
      ピヨカラ
    </button>

    <button
      class="starterBtn"
      onclick="chooseStarter(4)"
    >
      <span class="icon">🐶</span>
      イヌヌワン
    </button>

    <button
      class="starterBtn"
      onclick="chooseStarter(7)"
    >
      <span class="icon">🐱</span>
      ネココネコ
    </button>

  </div>

</div>


<!-- =========================================================
     マップ
========================================================= -->

<div id="mapScreen" class="screen">

  <div id="hud">

    <div class="hudLeft">

      <span id="mapName">
        パチタウン
      </span>

      <span>
        👣
        <span id="steps">0</span>
      </span>

    </div>

    <div>
      💰
      <span
        id="money"
        class="hudMoney"
      >
        1000
      </span>
      円
    </div>

  </div>

  <div id="mapArea">

    <div
      id="mapGrid"
      class="mapGrid"
    ></div>

  </div>

  <div id="message">
    パチモンの世界へようこそ！
  </div>

  <div id="controls">

    <div class="dpad">

      <button
        id="up"
        onclick="move(0,-1)"
      >
        ▲
      </button>

      <button
        id="left"
        onclick="move(-1,0)"
      >
        ◀
      </button>

      <button
        id="right"
        onclick="move(1,0)"
      >
        ▶
      </button>

      <button
        id="down"
        onclick="move(0,1)"
      >
        ▼
      </button>

    </div>

    <div class="menuButtons">

      <button onclick="openDex()">
        📖 図鑑
      </button>

      <button onclick="openParty()">
        👥 手持ち
      </button>

      <button onclick="openBox()">
        📦 BOX
      </button>

      <button onclick="openMainMenu()">
        ☰ メニュー
      </button>

    </div>

  </div>

</div>

<!-- =========================================================
     メインメニュー
========================================================= -->

<div
  id="mainMenu"
  class="overlay"
>

  <div class="panel">

    <h2>
      ☰ メニュー
    </h2>

    <button onclick="openDex()">
      📖 パチモン図鑑
    </button>

    <button onclick="openParty()">
      👥 手持ち
    </button>

    <button onclick="openBox()">
      📦 パチモンBOX
    </button>

    <button onclick="saveGame()">
      💾 セーブ
    </button>

    <button onclick="resetGame()">
      🔄 リセット
    </button>

    <button
      class="closeBtn"
      onclick="closeOverlays()"
    >
      閉じる
    </button>

  </div>

</div>

<!-- =========================================================
     図鑑
========================================================= -->

<div
  id="dexPanel"
  class="overlay"
>

  <div class="panel">

    <h2>
      📖 パチモン図鑑
    </h2>

    <div
      id="dexGrid"
      class="dexGrid"
    ></div>

/* =========================================================
   マップ検証
========================================================= */

function validateMaps(){

 MAPS.forEach(map=>{

   /* -------------------------------------------------------
      行数チェック
   ------------------------------------------------------- */

   if(map.tiles.length!==map.height){

     console.warn(
       `MAP ${map.id}: 行数が不一致です。`,
       `設定:${map.height}`,
       `実際:${map.tiles.length}`
     );

   }

   /* -------------------------------------------------------
      各行の幅チェック
   ------------------------------------------------------- */

   map.tiles.forEach((row,index)=>{

     if(row.length!==map.width){

       console.warn(
         `MAP ${map.id}: ${index+1}行目の幅が不一致です。`,
         `設定:${map.width}`,
         `実際:${row.length}`,
         row
       );

     }

   });

   /* -------------------------------------------------------
      exits の座標が本当に E かチェック
   ------------------------------------------------------- */

   Object.entries(map.exits).forEach(
     ([key,exit])=>{

       const [x,y]=
         key
           .split(",")
           .map(Number);

       const tile=
         map.tiles[y] &&
         map.tiles[y][x];

       if(tile!=="E"){

         console.warn(
           `MAP ${map.id}: 出口 ${key} が E ではありません。`,
           `現在のタイル:${tile}`
         );

       }

       /* ---------------------------------------------------
          移動先MAPが存在するかチェック
       --------------------------------------------------- */

       const destination=
         MAPS.find(
           m=>m.id===exit.map
         );

       if(!destination){

         console.warn(
           `MAP ${map.id}: 出口 ${key} の移動先 MAP ${exit.map} が存在しません。`
         );

       }

     }
   );

   /* -------------------------------------------------------
      E があるのに exits に登録されていない場所をチェック
   ------------------------------------------------------- */

   for(
     let y=0;
     y<map.height;
     y++
   ){

     for(
       let x=0;
       x<map.width;
       x++
     ){

       const tile=
         map.tiles[y] &&
         map.tiles[y][x];

       if(tile==="E"){

         const key=
           `${x},${y}`;

         if(!map.exits[key]){

           console.warn(
             `MAP ${map.id}: E (${key}) に出口設定がありません。`
           );

         }

       }

     }

   }

 });

}

/* =========================================================
   マップ描画
========================================================= */

function renderMap(){

 const map=
   MAPS[state.map];

 if(!map){

   state.map=0;
   state.x=5;
   state.y=6;

   return renderMap();

 }

 const grid=
   document.getElementById("mapGrid");

 grid.innerHTML="";

 grid.style.gridTemplateColumns=
   `repeat(${map.width},1fr)`;

 grid.style.gridTemplateRows=
   `repeat(${map.height},1fr)`;

 document.getElementById("mapName")
   .textContent=
     map.name;

 for(
   let y=0;
   y<map.height;
   y++
 ){

   const row=
     map.tiles[y] || "";

   for(
     let x=0;
     x<map.width;
     x++
   ){

     let ch=
       row[x] || ".";

     const tile=
       document.createElement("div");

     tile.className="tile";

     if(ch==="#"){

       tile.classList.add("wall");

       tile.textContent="🧱";

     }

     else if(ch==="."){

       tile.classList.add("grass");

       tile.textContent="🌱";

     }

     else if(ch==="="){

       tile.classList.add("road");

       tile.textContent="";

     }

     else if(ch==="T"){

       tile.classList.add("tree");

       tile.textContent="🌳";

     }

     else if(ch==="W"){

       tile.classList.add("water");

       tile.textContent="🌊";

     }

     else if(ch==="C"){

       tile.classList.add("center");

       tile.textContent="🏥";

     }

     else if(ch==="S"){

       tile.classList.add("shop");

       tile.textContent="🛒";

     }

     else if(ch==="E"){

       tile.classList.add("exit");

       tile.textContent="➡️";

     }

     if(
       x===state.x &&
       y===state.y
     ){

       tile.classList.add("player");

       tile.innerHTML=
         `<span class="mapPlayerIcon">🧑</span>`;

     }

     grid.appendChild(tile);

   }

 }

 updateHUD();

}

/* =========================================================
   移動
========================================================= */

function move(dx,dy){

 if(!state.started) return;

 const map=
   MAPS[state.map];

 const nx=
   state.x+dx;

 const ny=
   state.y+dy;

 if(
   nx<0 ||
   ny<0 ||
   nx>=map.width ||
   ny>=map.height
 ){

   return;

 }

 const tile=
   map.tiles[ny][nx];

 if(tile==="#"){

   setMessage(
     "壁があって進めません。"
   );

   return;

 }

 if(tile==="T"){

   setMessage(
     "木があって進めません。"
   );

   return;

 }

 if(tile==="W"){

   setMessage(
     "水があって進めません。"
   );

   return;

 }

 state.x=nx;
 state.y=ny;

 state.steps++;

 checkTile();

 renderMap();

}

/* =========================================================
   マップイベント
========================================================= */

function checkTile(){

 const map=
   MAPS[state.map];

 const tile=
   map.tiles[state.y][state.x];

 if(tile==="E"){

   const exit=
     map.exits[
       `${state.x},${state.y}`
     ];

   if(exit){

     changeMap(
       exit.map,
       exit.x,
       exit.y
     );

     return;

   }

 }

 if(tile==="C"){

   healParty();

   setMessage(
     "パチモンセンターで全員のHPが回復しました！"
   );

   setTimeout(
     ()=>{
       openShop();
     },
     150
   );

   return;

 }

 if(
   tile==="." ||
   tile==="="
 ){

   const chance=
     tile==="."
       ? 0.25
       : 0.12;

   if(
     Math.random()<chance
   ){

     startWildBattle();

   }

 }

}

function changeMap(
  mapId,
  x,
  y
){

 if(!MAPS[mapId]){

   console.error(
     "存在しないMAPへ移動しようとしました:",
     mapId

   return;

 }

 state.map=mapId;

 state.x=x;
 state.y=y;

 renderMap();

 setMessage(
   `${MAPS[mapId].name}に入りました！`
 );

}

function doBoxPartySwap(
  slot,
  partyIndex
){

 const temp=
   state.party[partyIndex];

 state.party[partyIndex]=
   state.boxes[currentBox][slot];

 state.boxes[currentBox][slot]=
   temp;

 closeModal();

 renderBox();

 setMessage(
   "手持ちとBOXを入れ替えました！"
 );

}

/* =========================================================
   手持ち→BOX
========================================================= */

function openBoxForParty(
  partyIndex
){

 closeModal();

 if(
   state.party.length<=1
 ){

   alert(
     "手持ちが1匹しかいないため、預けられません。"
   );

   return;

 }

 let html=`

   <h2>
     預けるBOXを選択
   </h2>

   <p>
     空いているBOXスロットを選んでください。
   </p>

 `;

 for(
   let b=0;
   b<5;
   b++
 ){

   const empty=
     state.boxes[b]
       .findIndex(
         x=>x===null
       );

   if(empty>=0){

     html+=`

       <button
         style="width:100%"
         onclick="
           partyToBox(
             ${partyIndex},
             ${b},
             ${empty}
           )
         "
       >

         BOX ${b+1}
         ／
         ${empty+1}番

       </button>

     `;

   }

 }

 html+=`

   <button
     onclick="closeModal()"
     style="width:100%"
   >
     キャンセル
   </button>

 `;

 openModal(html);

}

function partyToBox(
  partyIndex,
  boxIndex,
  slot
){

 const mon=
   state.party[partyIndex];

 state.boxes[boxIndex][slot]=
   mon;

 state.party.splice(
   partyIndex,
   1
 );

 closeModal();

 closeOverlays();

 setMessage(
   `${getMonsterName(mon)}をBOXへ預けました。`
 );

}

/* =========================================================
   戦闘開始
========================================================= */

function startWildBattle(){

 const alive=
   firstAlive();

 if(alive<0){

   healParty();

   setMessage(
     "手持ちが全員ひんしだったため、回復しました。"
   );

   return;

 }

 let id;

 const maxId=
   state.map>=6
     ? 50
     : state.map>=4
       ? 42
       : state.map>=2
         ? 36
         : 30;

 id=
   Math.floor(
     Math.random()*maxId
   )+1;

 const level=
   Math.max(
     3,
     Math.min(
       35,
       3+
       state.map*3+
       Math.floor(
         Math.random()*6
       )
     )
   );

 const enemy=
   createMonster(
     id,
     level
   );

 state.battle={

   enemy:enemy,

   playerIndex:alive,

   captured:false

 };

 addDex(id);

 showScreen(
   "battleScreen"
 );

  startBGM("battle");

 renderBattle();

 setBattleText(
   `野生の${getMonsterName(enemy)}が現れた！`
 );

}

/* =========================================================
   技使用
========================================================= */

function useMove(
  moveIndex
){

 closeModal();

 const battle=
   state.battle;

 if(!battle) return;

 const player=
   state.party[
     battle.playerIndex
   ];

 const enemy=
   battle.enemy;

 const move=
   MOVES[moveIndex];

 let damage=
   move.power+
   player.atk+
   Math.floor(
     Math.random()*6
   );

 enemy.hp=
   Math.max(
     0,
     enemy.hp-damage
   );

 setBattleText(
   `${getMonsterName(player)}の「${move.name}」！ ${damage}ダメージ！`
 );

 renderBattle();

 if(enemy.hp<=0){

   setTimeout(
     ()=>{
       winBattle();
     },
     700
   );

   return;

 }

 setTimeout(
   ()=>{
     enemyAttack();
   },
   700
 );

}

/* =========================================================
   戦闘中パチモン変更
========================================================= */

function switchBattleMonster(
  newIndex
){

 const battle=
   state.battle;

 if(!battle) return;

 if(
   newIndex===
   battle.playerIndex
 ){

   return;

 }

 const mon=
   state.party[newIndex];

 if(
   !mon ||
   mon.hp<=0
 ){

   return;

 }

 battle.playerIndex=
   newIndex;

 closeModal();

 renderBattle();

 setBattleText(
   `${getMonsterName(mon)}に入れ替えた！`
 );

 /* 入れ替え後は敵の攻撃 */

 setTimeout(
   ()=>{
     enemyAttack();
   },
   700
 );

}

/* =========================================================
   勝利
========================================================= */

function winBattle(){

 const battle=
   state.battle;

 const enemy=
   battle.enemy;

 const player=
   state.party[
     battle.playerIndex
   ];

 const money=
   50+
   enemy.level*15+
   Math.floor(
     Math.random()*50
   );

 const exp=
   35+
   enemy.level*8;

 state.money+=
   money;

 player.exp+=
   exp;

 const reward=
   getBattleDrop(enemy);

 let text=
   `${getMonsterName(enemy)}を倒した！<br>`+
   `${exp}EXP獲得！<br>`+
   `💰 ${money}円を手に入れた！`;

 if(reward){

/* =========================================================
   レベルアップ・進化
========================================================= */

function checkLevelUp(
  mon
){

 while(
   mon.exp>=100
 ){

   mon.exp-=100;

   mon.level++;

   mon.maxHp+=3;

   mon.hp=
     mon.maxHp;

   mon.atk+=2;

   const d=
     monsterData(mon.id);

   if(
     d.evo &&
     mon.level>=d.evoLv
   ){

     const oldName=
       d.name;

     const newId=
       d.evo;

     const newData=
       monsterData(newId);

     mon.id=
       newId;

     mon.maxHp=
       Math.max(
         mon.maxHp,
         newData.baseHp+
         Math.floor(
           (mon.level-1)*2.5
         )
       );

     mon.atk=
       Math.max(
         mon.atk,
         newData.atk+
         Math.floor(
           (mon.level-1)*1.3
         )
       );

     mon.hp=
       mon.maxHp;

     addDex(newId);

     setTimeout(
       ()=>{

         showEvolutionMessage(
           oldName,
           newData.name
         );

       },
       300
     );

   }

 }

}

   state.items[type]<=0

   state.party[
     state.battle.playerIndex
   ];

 if(player.hp<=0){

   alert(
     "ひんし状態では使えません。"
   );

   return;

 }

 if(
   player.hp>=player.maxHp
 ){

   alert(
     "HPは満タンです。"
   );

   return;

 }

 const item=
   ITEMS[type];

 state.items[type]--;

   player.hp;

   Math.min(
     player.maxHp,
     player.hp+item.heal
   );

   player.hp-before;

   state.items[type]<=0

   state.battle;

   state.party.length>=4
 ){

   alert(
     "手持ちが4匹なので捕まえられません。先にBOXへ預けてください。"
   );

 state.items[type]--;

 const item=
   ITEMS[type];

   1-

   Math.random()<chance

  /* =========================================================
   BGM
   Web Audio APIによる8bit風BGM
========================================================= */

let audioCtx=null;

let bgmGain=null;

let bgmTimer=null;

let bgmMode=null;

let bgmToken=0;


/* ---------------------------------------------------------
   音階
--------------------------------------------------------- */

function midiToFreq(midi){

 return 440*
   Math.pow(
     2,
     (midi-69)/12
   );

}


/* ---------------------------------------------------------
   AudioContext準備
--------------------------------------------------------- */

function ensureAudio(){

 if(!audioCtx){

   const AudioContext=
     window.AudioContext ||
     window.webkitAudioContext;

   if(!AudioContext){

     return false;

   }

   audioCtx=
     new AudioContext();

   bgmGain=
     audioCtx.createGain();

   bgmGain.gain.value=
     0.07;

   bgmGain.connect(
     audioCtx.destination
   );

 }

 if(
   audioCtx.state==="suspended"
 ){

   audioCtx.resume();

 }

 return true;

}


/* ---------------------------------------------------------
   1音鳴らす
--------------------------------------------------------- */

function playBGMNote(
  midi,
  start,
  duration,
  volume,
  type
){

 if(!audioCtx || !bgmGain){

   return;

 }

 const osc=
   audioCtx.createOscillator();

 const gain=
   audioCtx.createGain();

 osc.type=
   type || "square";

 osc.frequency.value=
   midiToFreq(midi);

 gain.gain.setValueAtTime(
   0.0001,
   start
 );

 gain.gain.exponentialRampToValueAtTime(
   volume,
   start+0.015
 );

 gain.gain.exponentialRampToValueAtTime(
   0.0001,
   start+
   Math.max(
     0.02,
     duration-0.02
   )
 );

 osc.connect(gain);

 gain.connect(bgmGain);

 osc.start(start);

 osc.stop(
   start+duration
 );

}


/* ---------------------------------------------------------
   BGM停止
--------------------------------------------------------- */

function stopBGM(){

 bgmToken++;

 if(bgmTimer){

   clearTimeout(
     bgmTimer
   );

 }

 bgmTimer=null;

 bgmMode=null;

}


/* ---------------------------------------------------------
   マップBGM
--------------------------------------------------------- */

const MAP_BGM={

 bpm:120,

 melody:[
   72,76,79,76,
   74,77,81,77,
   72,76,79,84,
   79,76,74,72
 ],

 bass:[
   48,48,55,55,
   50,50,57,57,
   48,48,55,55,
   43,43,48,48
 ]

};


/* ---------------------------------------------------------
   戦闘BGM
--------------------------------------------------------- */

const BATTLE_BGM={

 bpm:150,

 melody:[
   76,76,79,81,
   79,76,74,76,
   81,81,84,86,
   84,81,79,76
 ],

 bass:[
   40,40,47,47,
   43,43,50,50,
   45,45,52,52,
   40,40,47,47
 ]

};


/* ---------------------------------------------------------
   BGMループ
--------------------------------------------------------- */

function scheduleBGMLoop(
  mode,
  token
){

 if(
   token!==bgmToken ||
   bgmMode!==mode
 ){

   return;

 }

 if(!ensureAudio()){

   return;

 }

 const track=
   mode==="battle"
     ? BATTLE_BGM
     : MAP_BGM;

 const beat=
   60/track.bpm;

 const now=
   audioCtx.currentTime+
   0.05;

 track.melody.forEach(
   (note,index)=>{

     const start=
       now+
       index*beat;

     playBGMNote(
       note,
       start,
       beat*0.78,
       0.055,
       "square"
     );

   }
 );

 track.bass.forEach(
   (note,index)=>{

     const start=
       now+
       index*beat;

     playBGMNote(
       note,
       start,
       beat*0.82,
       0.035,
       "triangle"
     );

   }
 );

 const loopLength=
   track.melody.length*
   beat;

 bgmTimer=
   setTimeout(
     ()=>{

       scheduleBGMLoop(
         mode,
         token
       );

     },
     (loopLength-0.08)*1000
   );

}


/* ---------------------------------------------------------
   BGM開始
--------------------------------------------------------- */

function startBGM(mode){

 if(
   bgmMode===mode &&
   bgmTimer
 ){

   return;

 }

 if(!ensureAudio()){

   return;

 }

 stopBGM();

 bgmMode=
   mode;

 const token=
   ++bgmToken;

 scheduleBGMLoop(
   mode,
   token
 );

}

/* =========================================================
   ロード
========================================================= */

function loadGame(){

 try{

   const saved=
   localStorage.getItem(
  SAVE_KEY
);

   if(!saved){

     return false;

   }

   const data=
     JSON.parse(saved);

   state=data;

   if(
     !Array.isArray(state.boxes)
   ){

     state.boxes=
       Array.from(
         {length:5},
         ()=>Array(20).fill(null)
       );

   }

   while(
     state.boxes.length<5
   ){

     state.boxes.push(
       Array(20).fill(null)
     );

   }

   state.boxes=
     state.boxes.slice(0,5);

   state.boxes=
     state.boxes.map(
       box=>{

         if(
           !Array.isArray(box)
         ){

           return Array(20).fill(null);

         }

         while(
           box.length<20
         ){

           box.push(null);

         }

         return box.slice(0,20);

       }
     );

   if(
     !state.items
   ){

     state.items={

       potion:5,
       superPotion:0,
       capsule:5,
       superCapsule:2,
       hyperCapsule:1

     };

   }

   if(
     !Array.isArray(state.dex)
   ){

     state.dex=[];

   }

   if(
     !Array.isArray(state.party)
   ){

     state.party=[];

   }

   if(
     typeof state.money!=="number"
   ){

     state.money=1000;

   }

   if(
     typeof state.steps!=="number"
   ){

     state.steps=0;

   }

   if(
     typeof state.map!=="number" ||
     !MAPS[state.map]
   ){

     state.map=0;

     state.x=5;
     state.y=6;

   }

   return true;

 }catch(e){

   console.error(e);

   return false;

 }

}
