<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>パチッとモンスター</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#d8e8d0;
  font-family:
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  color:#222;
}

button{
  font-family:inherit;
  cursor:pointer;
}

#game{
  width:100%;
  max-width:720px;
  margin:auto;
  min-height:100vh;
  background:#f7f4e9;
  overflow:hidden;
}

header{
  background:#222;
  color:white;
  padding:12px;
  text-align:center;
  font-weight:bold;
  font-size:20px;
  letter-spacing:2px;
}

#screen{
  padding:12px;
}

.panel{
  background:white;
  border:3px solid #333;
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
}

h2,h3{
  margin-top:0;
}

.center{
  text-align:center;
}

.big{
  font-size:64px;
}

.small{
  font-size:12px;
  color:#666;
}

button.main{
  width:100%;
  padding:15px 10px;
  margin:5px 0;
  border:3px solid #333;
  border-radius:10px;
  background:#fff;
  font-size:17px;
  font-weight:bold;
}

button.main:active{
  transform:scale(.97);
}

button.danger{
  background:#ffd5d5;
}

button.green{
  background:#d9ffd9;
}

button.blue{
  background:#dceaff;
}

button.yellow{
  background:#fff2b8;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.monster-card{
  border:2px solid #444;
  border-radius:10px;
  padding:10px;
  background:#fafafa;
  text-align:center;
  min-height:130px;
}

.monster-icon{
  font-size:44px;
}

.hpbar{
  height:12px;
  border:2px solid #333;
  border-radius:8px;
  overflow:hidden;
  background:#ddd;
}

.hpfill{
  height:100%;
  background:#55b85a;
  transition:.3s;
}

.xpbar{
  height:7px;
  border:1px solid #333;
  border-radius:5px;
  overflow:hidden;
  background:#ddd;
}

.xpfill{
  height:100%;
  background:#477bd1;
}

.map{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:3px;
  background:#79a66a;
  padding:5px;
  border:3px solid #333;
  border-radius:10px;
}

.map-cell{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#a9cf91;
  border:1px solid #71965e;
  font-size:25px;
  user-select:none;
}

.map-cell.road{
  background:#d8c38b;
}

.map-cell.city{
  background:#ddd;
}

.map-cell.water{
  background:#8bc5df;
}

.map-cell.player{
  background:#fff0a0;
}

.battle{
  position:relative;
  min-height:380px;
  background:
    linear-gradient(#bfe5ff 0 58%,#a9d28f 58%);
  border:3px solid #333;
  border-radius:12px;
  overflow:hidden;
}

.battle-mon{
  position:absolute;
  text-align:center;
}

.enemy{
  top:25px;
  right:25px;
}

.player-mon{
  bottom:20px;
  left:25px;
}

.battle-icon{
  font-size:80px;
}

.battle-name{
  font-weight:bold;
  font-size:17px;
}

.battle-status{
  background:white;
  border:3px solid #333;
  border-radius:8px;
  padding:8px;
  min-width:180px;
}

.battle-menu{
  margin-top:10px;
}

.log{
  background:#222;
  color:#fff;
  padding:10px;
  border-radius:8px;
  min-height:65px;
  font-size:14px;
}

.choice{
  font-size:20px;
  padding:15px 5px;
}

.tabs{
  display:flex;
  gap:5px;
  overflow-x:auto;
  margin-bottom:10px;
}

.tab{
  flex:1;
  min-width:100px;
  padding:10px;
  border:2px solid #333;
  border-radius:8px;
  background:white;
  font-weight:bold;
}

.selected{
  background:#ffe990!important;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal-box{
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border:4px solid #222;
  border-radius:15px;
  padding:15px;
}

.hidden{
  display:none!important;
}

.menu-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.menu-grid button{
  min-height:70px;
}

.money{
  text-align:right;
  font-weight:bold;
}

@media(max-width:420px){
  #screen{
    padding:8px;
  }

  .battle-icon{
    font-size:65px;
  }

  .big{
    font-size:52px;
  }
}
</style>
</head>

</div>

};

 {id:0,name:"パチタウン",desc:"冒険の始まりの街。"},
 {id:1,name:"モンモンシティ",desc:"商店街がにぎやかな街。"},

];

/* =========================================================
   ゲーム状態
========================================================= */

let state = {
 started:false,
 playerName:"パチモン研究員",
 location:{x:3,y:5,city:0},
 party:[],
 boxes:Array.from({length:5},()=>Array(20).fill(null)),
 dex:[],
 items:{
   potion:5,
   capsule:5,
   superCapsule:2,
   hyperCapsule:1
 },
 money:1000,
 steps:0,
 battle:null
};

let screenMode="map";
let currentBox=0;

/* =========================================================
   ユーティリティ
========================================================= */

function monsterData(id){
  return MONSTERS.find(m=>m.id===id);
}

function clamp(n,min,max){
  return Math.max(min,Math.min(max,n));
}

function createMonster(id,level=5){
  const d=monsterData(id);
  const maxHp=d.baseHp+level*3;
  return {
    id,
    level,
    exp:0,
    hp:maxHp,
    maxHp,
    atk:d.atk+level*2,
    nickname:d.name
  };
}

function monsterName(mon){
  return monsterData(mon.id).name;
}

function addDex(id){
  if(!state.dex.includes(id)){
    state.dex.push(id);
  }
}

function addToParty(mon){
  if(state.party.length<4){
    state.party.push(mon);
    return true;
  }

  for(let b=0;b<5;b++){
    for(let s=0;s<20;s++){
      if(!state.boxes[b][s]){
        state.boxes[b][s]=mon;
        return false;
      }
    }
  }

  return false;
}

function firstAlive(){
  return state.party.findIndex(m=>m && m.hp>0);
}

function saveGame(){
  localStorage.setItem("pachimon_save",JSON.stringify(state));
  alert("ゲームをセーブしました！");
}

function loadGame(){
  try{
    const saved=localStorage.getItem("pachimon_save");
    if(saved){
      state=JSON.parse(saved);
      state.battle=null;
      return true;
    }
  }catch(e){}
  return false;
}

function resetGame(){
  localStorage.removeItem("pachimon_save");
  location.reload();
}

/* =========================================================
   画面
========================================================= */

function render(){
  const screen=document.getElementById("screen");

  if(!state.started){
    renderStart(screen);
    return;
  }

  if(screenMode==="map") renderMap(screen);
  if(screenMode==="menu") renderMenu(screen);
  if(screenMode==="dex") renderDex(screen);
  if(screenMode==="party") renderParty(screen);
  if(screenMode==="box") renderBox(screen);
  if(screenMode==="battle") renderBattle(screen);
}

/* =========================================================
   スタート
========================================================= */

function renderStart(el){

  el.innerHTML=`
    <div class="panel center">
      <div class="big">🥚</div>
      <h1>パチッとモンスター</h1>
      <h3>略して「パチモン」</h3>
      <p>50種類のパチモンを集めよう！</p>
      <p class="small">
        パチモンセンターで回復しながら<br>
        パチモン図鑑を完成させよう！
      </p>
    </div>

    <div class="panel">
      <h2>最初のパチモンを選ぼう！</h2>

      <button class="main choice" onclick="chooseStarter(1)">
        🐣 ピヨカラ
      </button>

      <button class="main choice" onclick="chooseStarter(4)">
        🐶 イヌヌワン
      </button>

      <button class="main choice" onclick="chooseStarter(7)">
        🐱 ネココネコ
      </button>
    </div>
  `;
}

function chooseStarter(id){
  state.started=true;
  const mon=createMonster(id,5);
  state.party=[mon];
  addDex(id);
  saveSilent();
  render();
}

function saveSilent(){
  localStorage.setItem("pachimon_save",JSON.stringify(state));
}

/* =========================================================
   マップ
========================================================= */

function renderMap(el){

    ["🏠","🏠","🏠","🛣️","🏠","🏠","🏠"],
    ["🌲","🌿","🌿","🛣️","🌿","🌿","🌲"],
    ["🌲","🌿","🌿","🛣️","🌿","🌿","🌲"],
    ["🌲","🌲","🌲","🛣️","🛣️","🌲","🌲"]
  ];

  let cells="";

  for(let y=0;y<7;y++){
    for(let x=0;x<7;x++){

      let content=map[y][x];

      if(x===state.location.x && y===state.location.y){
        content="🧑";
      }

      let cls="map-cell";

      if(map[y][x]==="🛣️") cls+=" road";
      if(map[y][x]==="🏠") cls+=" city";

      cells+=`
        <button
          class="${cls}"
          onclick="movePlayer(${x},${y})"
          aria-label="${x},${y}">
          ${content}
        </button>
      `;
    }
  }

  const city=CITIES[state.location.city];

  el.innerHTML=`
    <div class="panel">
      <div>
        <strong>📍 ${city.name}</strong>
      </div>
      <div class="small">${city.desc}</div>
    </div>

    <div class="map">
      ${cells}
    </div>

    <div class="panel">
      <h3>現在のパチモン</h3>
      ${partyMiniHTML()}
    </div>

    <div class="menu-grid">
      <button class="main blue" onclick="screenMode='menu';render()">📋 メニュー</button>
      <button class="main green" onclick="healAtCenter()">🏥 センター</button>
    </div>
  `;
}

function movePlayer(x,y){

  const dx=Math.abs(x-state.location.x);
  const dy=Math.abs(y-state.location.y);

  if(dx+dy!==1){
    return;
  }

  state.location.x=x;
  state.location.y=y;
  state.steps++;

  /* 家のマス */
  if(x===0 && y===3){
    state.location.city=0;
    healAtCenter(true);
    return;
  }

  if(x===6 && y===3){
    state.location.city=1;
    healAtCenter(true);
    return;
  }

  if(x===0 && y===0){
    state.location.city=2;
    healAtCenter(true);
    return;
  }

  if(x===6 && y===0){
    state.location.city=3;
    healAtCenter(true);
    return;
  }

  /* 道を歩いたらエンカウント */
  if(Math.random()<0.30){
    startWildBattle();
    return;
  }

  saveSilent();
  render();
}

function healAtCenter(silent=false){

  state.party.forEach(m=>{
    m.hp=m.maxHp;
  });

  if(!silent){
    alert("パチモンセンターで全回復しました！");
  }

  saveSilent();
  render();
}

/* =========================================================
   バトル
========================================================= */

function startWildBattle(){

  const possible=MONSTERS.filter(m=>m.id<=48);

  const d=possible[Math.floor(Math.random()*possible.length)];

  const level=clamp(
    3+Math.floor(state.steps/10),
    3,
    30
  );

  const enemy=createMonster(d.id,level);

  addDex(d.id);

  state.battle={
    enemy,
    playerIndex:firstAlive(),
    phase:"menu",
    log:`野生の ${d.name} が現れた！`
  };

  screenMode="battle";
  render();
}

function renderBattle(el){

  const b=state.battle;

  if(!b){
    screenMode="map";
    render();
    return;
  }

  const enemy=b.enemy;
  const player=state.party[b.playerIndex];

  const ed=monsterData(enemy.id);
  const pd=monsterData(player.id);

  el.innerHTML=`
    <div class="battle">

      <div class="battle-mon enemy">

        <div class="battle-status">
          <strong>${ed.name}</strong>
          Lv.${enemy.level}

          <div class="hpbar">
            <div class="hpfill"
              style="width:${enemy.hp/enemy.maxHp*100}%">
            </div>
          </div>

          HP ${enemy.hp}/${enemy.maxHp}
        </div>

        <div class="battle-icon">
          ${ed.icon}
        </div>

      </div>

      <div class="battle-mon player-mon">

        <div class="battle-icon">
          ${pd.icon}
        </div>

        <div class="battle-status">
          <strong>${pd.name}</strong>
          Lv.${player.level}

          <div class="hpbar">
            <div class="hpfill"
              style="width:${player.hp/player.maxHp*100}%">
            </div>
          </div>

          HP ${player.hp}/${player.maxHp}
        </div>

      </div>

    </div>

    <div class="log">
      ${b.log}
    </div>

    <div class="battle-menu">
      ${battleMenuHTML()}
    </div>
  `;
}

function battleMenuHTML(){

  const b=state.battle;

  if(b.phase==="moves"){
    return `
      <div class="panel">
        <h3>技を選んでください</h3>

        <div class="grid2">
          ${MOVES.slice(0,4).map((move,i)=>`
            <button class="main choice"
              onclick="useMove(${i})">
              ${move.name}
            </button>
          `).join("")}
        </div>

        <button class="main" onclick="state.battle.phase='menu';render()">
          戻る
        </button>
      </div>
    `;
  }

  if(b.phase==="items"){
    return `
      <div class="panel">
        <h3>どうぐ</h3>

        <button class="main"
          onclick="usePotion()">
          💊 傷薬 ×${state.items.potion}
        </button>

        <button class="main"
          onclick="useCapsule('capsule')">
          ⚪ パチッとカプセル ×${state.items.capsule}
        </button>

        <button class="main"
          onclick="useCapsule('superCapsule')">
          🔵 スーパー・パチッとカプセル ×${state.items.superCapsule}
        </button>

        <button class="main"
          onclick="useCapsule('hyperCapsule')">
          🟣 ハイパー・パチッとカプセル ×${state.items.hyperCapsule}
        </button>

        <button class="main" onclick="state.battle.phase='menu';render()">
          戻る
        </button>
      </div>
    `;
  }

  return `
    <div class="grid3">

      <button class="main choice"
        onclick="state.battle.phase='moves';render()">
        ⚔️<br>たたかう
      </button>

      <button class="main choice"
        onclick="state.battle.phase='items';render()">
        🎒<br>どうぐ
      </button>

      <button class="main choice"
        onclick="runAway()">
        🏃<br>逃げる
      </button>

    </div>
  `;
}

function useMove(index){

  const b=state.battle;
  const player=state.party[b.playerIndex];
  const enemy=b.enemy;

  const move=MOVES[index];

  let damage=
    move.power+
    player.atk+
    Math.floor(Math.random()*8);

  damage=Math.max(1,damage);

  enemy.hp=clamp(enemy.hp-damage,0,enemy.maxHp);

  b.log=`
    ${monsterName(player)}の<br>
    「${move.name}」！
    ${damage}ダメージ！
  `;

  if(enemy.hp<=0){
    winBattle();
    return;
  }

  setTimeout(enemyTurn,600);

  render();
}

function enemyTurn(){

  if(!state.battle) return;

  const b=state.battle;
  const player=state.party[b.playerIndex];
  const enemy=b.enemy;

  if(player.hp<=0){
    chooseNextMonster();
    return;
  }

  const damage=
    Math.max(
      1,
      enemy.atk+
      Math.floor(Math.random()*7)
    );

  player.hp=clamp(
    player.hp-damage,
    0,
    player.maxHp
  );

  b.log=`
    ${monsterName(enemy)}の攻撃！
    ${damage}ダメージ！
  `;

  if(player.hp<=0){
    b.log+=`<br>${monsterName(player)}は倒れた！`;
    chooseNextMonster();
    return;
  }

  render();
}

function chooseNextMonster(){

  const alive=state.party
    .map((m,i)=>m.hp>0?i:-1)
    .filter(i=>i>=0);

  if(alive.length===0){

    setTimeout(()=>{
      state.party.forEach(m=>m.hp=m.maxHp);
      state.location={x:3,y:5,city:0};
      state.battle=null;
      screenMode="map";
      alert("パチモンが全員倒れた！\nパチモンセンターまで戻された！");
      saveSilent();
      render();
    },500);

    return;
  }

  openModal(`
    <h2>パチモンを選んでください</h2>

    ${alive.map(i=>{
      const m=state.party[i];
      const d=monsterData(m.id);

      return `
        <button class="main"
          onclick="switchBattleMonster(${i})">
          ${d.icon} ${d.name}
          Lv.${m.level}
          HP ${m.hp}/${m.maxHp}
        </button>
      `;
    }).join("")}
  `);
}

function switchBattleMonster(index){

  state.battle.playerIndex=index;
  state.battle.log=
    `${monsterName(state.party[index])}に交代した！`;

  closeModal();
  render();
}

function winBattle(){

  const b=state.battle;
  const player=state.party[b.playerIndex];
  const enemy=b.enemy;

  const gained=20+enemy.level*5;

  player.exp+=gained;

  b.log=`
    野生の ${monsterName(enemy)} を倒した！
    <br>経験値 ${gained} を獲得！
  `;

  checkLevelUp(player);

  setTimeout(()=>{
    state.battle=null;
    screenMode="map";
    saveSilent();
    render();
  },1200);

  render();
}

function checkLevelUp(mon){

  while(mon.exp>=100){

    mon.exp-=100;
    mon.level++;

    const d=monsterData(mon.id);

    mon.maxHp+=3;
    mon.hp=mon.maxHp;
    mon.atk+=2;

    if(d.evo && mon.level>=d.evoLv){

      const oldName=d.name;
      const newData=monsterData(d.evo);

      mon.id=d.evo;
      mon.maxHp+=15;
      mon.hp=mon.maxHp;
      mon.atk+=5;

      addDex(newData.id);

      setTimeout(()=>{
        alert(
          `${oldName}は……\n`+
          `なんと！\n`+
          `${newData.name}に進化した！`
        );
      },100);
    }
  }
}

function usePotion(){

  if(state.items.potion<=0){
    state.battle.log="傷薬を持っていない！";
    render();
    return;
  }

  const player=state.party[state.battle.playerIndex];

  if(player.hp>=player.maxHp){
    state.battle.log="HPは満タンだ！";
    render();
    return;
  }

  state.items.potion--;

  const before=player.hp;

  player.hp=clamp(
    player.hp+ITEMS.potion.heal,
    0,
    player.maxHp
  );

  state.battle.log=
    `傷薬を使った！<br>`+
    `${player.hp-before}回復した！`;

  setTimeout(enemyTurn,600);
  render();
}

function useCapsule(type){

  if(state.items[type]<=0){
    state.battle.log="そのカプセルを持っていない！";
    render();
    return;
  }

  state.items[type]--;

  const enemy=state.battle.enemy;
  const data=ITEMS[type];

  let hpBonus=
    1-(enemy.hp/enemy.maxHp)*0.5;

  let chance=
    0.30*
    data.rate*
    hpBonus;

  chance=clamp(chance,0.05,0.95);

  const success=Math.random()<chance;

  if(success){

    const captured={
      ...enemy
    };

    addDex(captured.id);

    if(!addToParty(captured)){

      state.battle.log=
        "パチモンを捕まえた！<br>"+
        "しかし手持ちもBOXもいっぱいだ！";

      setTimeout(()=>{
        state.battle=null;
        screenMode="map";
        render();
      },1200);

      render();
      return;
    }

    state.battle.log=
      `カプセルが……<br>`+
      `カチッ！<br>`+
      `${monsterName(enemy)}を捕まえた！`;

    setTimeout(()=>{
      state.battle=null;
      screenMode="map";
      saveSilent();
      render();
    },1200);

  }else{

    state.battle.log=
      `${monsterName(enemy)}はカプセルから飛び出した！`;

    setTimeout(enemyTurn,700);
  }

  render();
}

function runAway(){

  if(Math.random()<0.95){

    state.battle.log="うまく逃げ切った！";

    setTimeout(()=>{
      state.battle=null;
      screenMode="map";
      render();
    },600);

  }else{

    state.battle.log="逃げられない！";

    setTimeout(enemyTurn,600);
  }

  render();
}

========================================================= */

function openModal(html){
  document.getElementById("modalBox").innerHTML=html;
  document.getElementById("modal").classList.remove("hidden");
}

function closeModal(){
  document.getElementById("modal").classList.add("hidden");
}

   初期化
========================================================= */

(function init(){

  const loaded=loadGame();

  if(loaded && state.started){
    screenMode="map";
  }

  render();

})();
</script>
