<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>パチッとモンスター</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  overflow:hidden;
}

button{
  font:inherit;
  touch-action:manipulation;
}

#game{
  width:100vw;
  height:100vh;
  max-width:900px;
  margin:auto;
  position:relative;
  background:#79b95b;
  overflow:hidden;
}

.screen{
  position:absolute;
  inset:0;
  display:none;
}

.screen.active{
  display:block;
}

/* =========================
   タイトル
========================= */

#titleScreen{
  background:
    radial-gradient(circle at 50% 30%,#fff 0,#ffe36e 8%,transparent 9%),
    linear-gradient(#62b7e8,#9ee0ff 50%,#70c65a 50%);
  text-align:center;
  padding:40px 20px;
}

.title{
  margin-top:10vh;
  font-size:clamp(42px,11vw,85px);
  font-weight:900;
  color:#fff;
  text-shadow:
    4px 4px 0 #333,
    -2px -2px 0 #333,
    2px -2px 0 #333,
    -2px 2px 0 #333;
  transform:rotate(-2deg);
}

.subtitle{
  margin-top:10px;
  font-size:20px;
  font-weight:bold;
  color:#222;
}

.startBox{
  margin:50px auto 0;
  max-width:500px;
  background:#fff;
  color:#222;
  border:5px solid #222;
  border-radius:18px;
  padding:20px;
  box-shadow:0 8px 0 #333;
}

.startBox h2{
  margin:0 0 15px;
}

.starterButtons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.starterBtn{
  border:3px solid #222;
  background:#f7f7f7;
  border-radius:12px;
  padding:12px 4px;
  font-size:16px;
  cursor:pointer;
}

.starterBtn .icon{
  display:block;
  font-size:42px;
}

.starterBtn:active{
  transform:translateY(3px);
}

/* =========================
   共通HUD
========================= */

#mapScreen{
  background:#72bb5c;
}

#hud{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:20;
  background:rgba(20,20,20,.88);
  padding:7px 9px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
}

.hudLeft{
  display:flex;
  gap:8px;
  align-items:center;
}

.hudMoney{
  color:#ffe66d;
  font-weight:bold;
}

#mapName{
  font-weight:bold;
}

/* =========================
   マップ
========================= */

#mapArea{
  position:absolute;
  top:42px;
  left:0;
  right:0;
  bottom:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.mapGrid{
  display:grid;
  gap:1px;
  background:#333;
  border:4px solid #333;
  max-width:96vw;
  max-height:calc(100vh - 220px);
  aspect-ratio:1;
}

.tile{
  width:min(8vw,48px);
  height:min(8vw,48px);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:min(6vw,32px);
  user-select:none;
}

.tile.grass{
  background:#78bd55;
}

.tile.road{
  background:#d7bd82;
}

.tile.water{
  background:#54aee0;
}

.tile.tree{
  background:#4b9b4a;
}

.tile.wall{
  background:#777;
}

.tile.building{
  background:#d98b57;
}

.tile.center{
  background:#f1e9df;
}

.tile.shop{
  background:#e8c34d;
}

.tile.exit{
  background:#d7bd82;
}

.tile.player{
  background:#d7bd82;
}

.playerIcon{
  font-size:min(6vw,30px);
  z-index:2;
}

#message{
  position:absolute;
  left:8px;
  right:8px;
  bottom:155px;
  min-height:38px;
  background:rgba(0,0,0,.78);
  border:2px solid #fff;
  border-radius:8px;
  padding:8px 10px;
  z-index:10;
  font-size:14px;
  pointer-events:none;
}

/* =========================
   操作パネル
========================= */

#controls{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:150px;
  background:#222;
  border-top:4px solid #111;
  z-index:30;
}

.dpad{
  position:absolute;
  left:15px;
  bottom:14px;
  width:135px;
  height:120px;
}

.dpad button{
  position:absolute;
  width:45px;
  height:40px;
  border:2px solid #111;
  border-radius:7px;
  background:#ddd;
  color:#111;
  font-size:22px;
  font-weight:bold;
}

#up{left:45px;top:0}
#left{left:0;top:40px}
#right{right:0;top:40px}
#down{left:45px;bottom:0}

.menuButtons{
  position:absolute;
  right:8px;
  bottom:8px;
  width:calc(100% - 165px);
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:5px;
}

.menuButtons button{
  padding:8px 4px;
  border:2px solid #111;
  border-radius:7px;
  background:#eee;
  color:#111;
  font-weight:bold;
}

/* =========================
   メニュー
========================= */

.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.overlay.active{
  display:flex;
}

.panel{
  width:min(700px,96vw);
  max-height:92vh;
  overflow:auto;
  background:#f5f5f5;
  color:#222;
  border:4px solid #222;
  border-radius:14px;
  padding:15px;
}

.panel h2{
  margin:0 0 12px;
}

.panel button{
  border:2px solid #222;
  border-radius:8px;
  background:#fff;
  padding:9px;
  margin:3px;
  cursor:pointer;
}

.closeBtn{
  width:100%;
  background:#333 !important;
  color:#fff !important;
  margin-top:10px !important;
}

/* =========================
   パーティー
========================= */

.monsterList{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.monsterCard{
  border:3px solid #333;
  border-radius:10px;
  padding:8px;
  background:#fff;
}

.monsterCard.dead{
  opacity:.5;
}

.monsterIcon{
  font-size:35px;
  float:left;
  margin-right:8px;
}

.hpbar{
  height:10px;
  background:#ccc;
  border:1px solid #333;
  border-radius:5px;
  overflow:hidden;
  margin-top:4px;
}

.hpfill{
  height:100%;
  background:#48a848;
}

.small{
  font-size:12px;
}

/* =========================
   図鑑
========================= */

.dexGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
}

.dexItem{
  border:2px solid #555;
  border-radius:8px;
  padding:7px;
  background:#fff;
  min-height:65px;
}

.dexUnknown{
  color:#888;
}

/* =========================
   BOX
========================= */

.boxTabs{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:3px;
  margin-bottom:8px;
}

.boxTabs button{
  margin:0;
  padding:6px 2px;
}

.boxGrid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
}

.boxSlot{
  min-height:70px;
  border:2px solid #777;
  border-radius:7px;
  background:#ddd;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  cursor:pointer;
}

.boxSlot.occupied{
  background:#fff;
  border-color:#222;
}

.boxSlot .slotIcon{
  font-size:25px;
}

/* =========================
   戦闘
========================= */

#battleScreen{
  background:
    linear-gradient(#a7d8f2 0 45%,#82c56b 45% 100%);
}

.battleTop{
  position:absolute;
  top:15px;
  right:12px;
  width:48%;
  background:#fff;
  color:#222;
  border:3px solid #222;
  border-radius:10px;
  padding:8px;
}

.battleBottom{
  position:absolute;
  left:12px;
  bottom:260px;
  width:48%;
  background:#fff;
  color:#222;
  border:3px solid #222;
  border-radius:10px;
  padding:8px;
  z-index:15;
}
.battleMonster{
  text-align:center;
  font-size:80px;
  position:absolute;
}

#wildIcon{
  right:18%;
  top:24%;
}

#playerIcon{
  left:18%;
  bottom:35%;
}

.battleMenu{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:165px;
  background:#222;
  border-top:4px solid #111;
  padding:8px;
  z-index:20;
}

.battleButtons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
}

.battleButtons button{
  padding:10px;
  border:2px solid #111;
  border-radius:7px;
  font-weight:bold;
}

.battleText{
  position:absolute;
  left:8px;
  right:8px;
  bottom:168px;
  background:rgba(0,0,0,.85);
  border:2px solid #fff;
  border-radius:8px;
  padding:9px;
  z-index:25;
  min-height:42px;
}

/* =========================
   ショップ
========================= */

.shopItems{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.shopItem{
  border:3px solid #333;
  border-radius:10px;
  padding:10px;
  background:#fff;
}

.shopItem h3{
  margin:0 0 4px;
}

.price{
  color:#c88a00;
  font-weight:bold;
}

/* =========================
   モーダル
========================= */

.modalBox{
  width:min(600px,94vw);
  background:#fff;
  color:#222;
  border:4px solid #222;
  border-radius:12px;
  padding:15px;
}

.modalButtons{
  display:grid;
  gap:5px;
  margin-top:10px;
}

/* =========================
   レスポンシブ
========================= */

@media(max-width:500px){
  .title{
    font-size:48px;
  }

  .starterBtn .icon{
    font-size:32px;
  }

  .monsterList{
    grid-template-columns:1fr;
  }

  .battleMonster{
    font-size:65px;
  }

  .tile{
    width:9vw;
    height:9vw;
    font-size:7vw;
  }
}
</style>
</head>

<body>

<div id="game">

<!-- =========================
     タイトル
========================= -->

<div id="titleScreen" class="screen active">

  <div class="title">パチモン</div>

  <div class="subtitle">
    パチッとモンスター
  </div>

  <div class="startBox">

    <h2>最初のパチモンを選ぼう！</h2>

    <div class="starterButtons">

      <button class="starterBtn" onclick="chooseStarter(1)">
        <span class="icon">🐣</span>
        ピヨカラ
      </button>

      <button class="starterBtn" onclick="chooseStarter(4)">
        <span class="icon">🐶</span>
        イヌヌワン
      </button>

      <button class="starterBtn" onclick="chooseStarter(7)">
        <span class="icon">🐱</span>
        ネココネコ
      </button>

    </div>

  </div>

</div>

<!-- =========================
     マップ
========================= -->

<div id="mapScreen" class="screen">

  <div id="hud">
    <div class="hudLeft">
      <span id="mapName">パチタウン</span>
      <span>👣<span id="steps">0</span></span>
    </div>

    <div>
      💰 <span id="money" class="hudMoney">1000</span>円
    </div>
  </div>

  <div id="mapArea">
    <div id="mapGrid" class="mapGrid"></div>
  </div>

  <div id="message">
    パチモンの世界へようこそ！
  </div>

  <div id="controls">

    <div class="dpad">

      <button id="up" onclick="move(0,-1)">▲</button>
      <button id="left" onclick="move(-1,0)">◀</button>
      <button id="right" onclick="move(1,0)">▶</button>
      <button id="down" onclick="move(0,1)">▼</button>

    </div>

    <div class="menuButtons">

      <button onclick="openDex()">📖 図鑑</button>
      <button onclick="openParty()">👥 手持ち</button>
      <button onclick="openBox()">📦 BOX</button>
      <button onclick="openMainMenu()">☰ メニュー</button>

    </div>

  </div>

</div>

<!-- =========================
     メインメニュー
========================= -->

<div id="mainMenu" class="overlay">

  <div class="panel">

    <h2>メニュー</h2>

    <button onclick="openDex()">📖 パチモン図鑑</button>
    <button onclick="openParty()">👥 手持ち</button>
    <button onclick="openBox()">📦 パチモンBOX</button>

    <button onclick="saveGame()">💾 セーブ</button>

    <button onclick="resetGame()">
      🔄 リセット
    </button>

    <button class="closeBtn" onclick="closeOverlays()">
      閉じる
    </button>

  </div>

</div>

<!-- =========================
     図鑑
========================= -->

<div id="dexPanel" class="overlay">

  <div class="panel">

    <h2>📖 パチモン図鑑</h2>

    <div id="dexGrid" class="dexGrid"></div>

    <button class="closeBtn" onclick="closeOverlays()">
      閉じる
    </button>

  </div>

</div>

<!-- =========================
     手持ち
========================= -->

<div id="partyPanel" class="overlay">

  <div class="panel">

    <h2>👥 手持ちパチモン</h2>

    <div id="partyList" class="monsterList"></div>

    <button class="closeBtn" onclick="closeOverlays()">
      閉じる
    </button>

  </div>

</div>

<!-- =========================
     BOX
========================= -->

<div id="boxPanel" class="overlay">

  <div class="panel">

    <h2>📦 パチモンBOX</h2>

    <div id="boxTabs" class="boxTabs"></div>

    <div id="boxGrid" class="boxGrid"></div>

    <button class="closeBtn" onclick="closeOverlays()">
      閉じる
    </button>

  </div>

</div>

<!-- =========================
     戦闘
========================= -->

<div id="battleScreen" class="screen">

  <div class="battleTop">

    <b id="wildName">野生のパチモン</b>

    <div>
      Lv.<span id="wildLevel">5</span>
    </div>

    <div class="hpbar">
      <div id="wildHpFill" class="hpfill"></div>
    </div>

    <div class="small">
      HP <span id="wildHp">20</span>/<span id="wildMaxHp">20</span>
    </div>

  </div>

  <div id="wildIcon" class="battleMonster">
    🐣
  </div>

  <div id="playerIcon" class="battleMonster">
    🐣
  </div>

  <div class="battleBottom">

    <b id="playerNameBattle">ピヨカラ</b>

    <div>
      Lv.<span id="playerLevelBattle">5</span>
    </div>

    <div class="hpbar">
      <div id="playerHpFill" class="hpfill"></div>
    </div>

    <div class="small">
      HP <span id="playerHpBattle">20</span>/<span id="playerMaxHpBattle">20</span>
    </div>

  </div>

  <div id="battleText" class="battleText">
    野生のパチモンが現れた！
  </div>

  <div class="battleMenu">

    <div id="battleButtons" class="battleButtons">

      <button onclick="battleFight()">
        ⚔️ たたかう
      </button>

      <button onclick="battleItems()">
        🎒 どうぐ
      </button>

      <button onclick="battleRun()">
        🏃 逃げる
      </button>

    </div>

  </div>

</div>

<!-- =========================
     ショップ
========================= -->

<div id="shopPanel" class="overlay">

  <div class="panel">

    <h2>🏥 パチモンセンター</h2>

    <p>
      パチモンセンターへようこそ！<br>
      パチモンの回復と道具の売買ができます。
    </p>

    <div id="shopItems" class="shopItems"></div>

    <button onclick="sellItems()">
      💰 道具を売る
    </button>

    <button class="closeBtn" onclick="closeOverlays()">
      閉じる
    </button>

  </div>

</div>

<!-- =========================
     汎用モーダル
========================= -->

<div id="modal" class="overlay">

  <div id="modalContent" class="modalBox"></div>

</div>

</div>

<script>

/* =========================================================
   基本関数
========================================================= */

function monsterData(id){
 return MONSTERS.find(m=>m.id===id);
}

function clamp(v,min,max){
 return Math.max(min,Math.min(max,v));
}

function createMonster(id,level=5){

 const d=monsterData(id);

 const maxHp=
   d.baseHp+
   Math.floor((level-1)*2.5);

 return {

   id:id,

   level:level,

   exp:0,

   maxHp:maxHp,

   hp:maxHp,

   atk:d.atk+
      Math.floor((level-1)*1.3)

 };

}

function getMonsterName(mon){
 return monsterData(mon.id)?.name || "？？？";
}

function addDex(id){

 if(!state.dex.includes(id)){
   state.dex.push(id);
 }

}

========================================================= */

function renderMap(){

 const map=MAPS[state.map];

 const grid=document.getElementById("mapGrid");

 grid.innerHTML="";

 grid.style.gridTemplateColumns=
   `repeat(${map.width},1fr)`;

 document.getElementById("mapName")
   .textContent=map.name;

 for(let y=0;y<map.height;y++){

   for(let x=0;x<map.width;x++){

     let ch=map.tiles[y][x];

     const tile=document.createElement("div");

     tile.className="tile";

     if(ch==="#"){
       tile.classList.add("wall");
       tile.textContent="🧱";
     }

     else if(ch==="."){
       tile.classList.add("grass");
       tile.textContent="🌱";
     }

     else if(ch==="="){
       tile.classList.add("road");
       tile.textContent="";
     }

     else if(ch==="T"){
       tile.classList.add("tree");
       tile.textContent="🌳";
     }

     else if(ch==="W"){
       tile.classList.add("water");
       tile.textContent="🌊";
     }

     else if(ch==="C"){
       tile.classList.add("center");
       tile.textContent="🏥";
     }

     else if(ch==="S"){
       tile.classList.add("shop");
       tile.textContent="🛒";
     }

     else if(ch==="E"){
       tile.classList.add("exit");
       tile.textContent="➡️";
     }

     if(x===state.x && y===state.y){

       tile.classList.add("player");

       tile.innerHTML=
         `<span class="playerIcon">🧑</span>`;

     }

     grid.appendChild(tile);

   }

 }

 updateHUD();

}

/* =========================================================
   移動
========================================================= */

function move(dx,dy){

 if(!state.started) return;

 const map=MAPS[state.map];

 const nx=state.x+dx;
 const ny=state.y+dy;

 if(
   nx<0 ||
   ny<0 ||
   nx>=map.width ||
   ny>=map.height
 ){
   return;
 }

 const tile=map.tiles[ny][nx];

 if(tile==="#"){
   setMessage("壁があって進めません。");
   return;
 }

 if(tile==="T"){
   setMessage("木があって進めません。");
   return;
 }

 if(tile==="W"){
   setMessage("水があって進めません。");
   return;
 }

 state.x=nx;
 state.y=ny;

 state.steps++;

 checkTile();

 renderMap();

}

/* =========================================================
   マップイベント
========================================================= */

function checkTile(){

 const map=MAPS[state.map];

 const tile=map.tiles[state.y][state.x];

 /* 出口 */

 if(tile==="E"){

   const exit=
     map.exits[`${state.x},${state.y}`];

   if(exit){

     changeMap(
       exit.map,
       exit.x,
       exit.y
     );

     return;

   }

 }

 /* パチモンセンター */

 if(tile==="C"){

   healParty();

   setMessage(
     "パチモンセンターで全員のHPが回復しました！"
   );

   setTimeout(()=>{
     openShop();
   },150);

   return;

 }

 /* 草・道でエンカウント */

 if(tile==="." || tile==="="){

   const chance=
     tile==="." ? 0.25 : 0.12;

   if(Math.random()<chance){

     startWildBattle();

   }

 }

}

/* =========================================================
   BOX操作
========================================================= */

function boxSlotAction(slot){

 const mon=
   state.boxes[currentBox][slot];

 if(!mon) return;

 let html=`

   <h2>${monsterData(mon.id).icon}
       ${monsterData(mon.id).name}</h2>

   <p>
     Lv.${mon.level}<br>
     HP ${mon.hp}/${mon.maxHp}
   </p>

   <div class="modalButtons">

 `;

 if(state.party.length<4){

   html+=`
     <button onclick="boxToParty(${slot})">
       手持ちに加える
     </button>
   `;

 }else{

   html+=`
     <button onclick="swapBoxWithParty(${slot})">
       手持ちと入れ替える
     </button>
   `;

 }

 html+=`

     <button onclick="closeModal()">
       キャンセル
     </button>

   </div>
 `;

 openModal(html);

}

function boxToParty(slot){

 const mon=
   state.boxes[currentBox][slot];

 if(!mon) return;

 if(state.party.length>=4){

   alert("手持ちは4匹までです。");

   return;

 }

 state.party.push(mon);

 state.boxes[currentBox][slot]=null;

 closeModal();

 renderBox();

 setMessage(
   `${getMonsterName(mon)}を手持ちに加えました！`
 );

}

function swapBoxWithParty(slot){

 const boxMon=
   state.boxes[currentBox][slot];

 if(!boxMon) return;

 let html=`
   <h2>入れ替えるパチモンを選択</h2>
 `;

 state.party.forEach((mon,index)=>{

   const d=monsterData(mon.id);

   html+=`
     <button
       style="width:100%;text-align:left"
       onclick="doBoxPartySwap(${slot},${index})"
     >
       ${d.icon} ${d.name}
       Lv.${mon.level}
     </button>
   `;

 });

 html+=`
   <button
     onclick="closeModal()"
     style="width:100%"
   >
     キャンセル
   </button>
 `;

 openModal(html);

}

function doBoxPartySwap(slot,partyIndex){

 const temp=
   state.party[partyIndex];

 state.party[partyIndex]=
   state.boxes[currentBox][slot];

 state.boxes[currentBox][slot]=temp;

 closeModal();

 renderBox();

 setMessage("手持ちとBOXを入れ替えました！");

}

/* =========================================================
   手持ち→BOX
========================================================= */

function openBoxForParty(partyIndex){

 closeModal();

 if(state.party.length<=1){

   alert(
     "手持ちが1匹しかいないため、預けられません。"
   );

   return;

 }

 let html=`

   <h2>預けるBOXを選択</h2>

   <p>
     空いているBOXスロットを選んでください。
   </p>

 `;

 for(let b=0;b<5;b++){

   const empty=
     state.boxes[b]
       .findIndex(x=>x===null);

   if(empty>=0){

     html+=`
       <button
         style="width:100%"
         onclick="
           partyToBox(
             ${partyIndex},
             ${b},
             ${empty}
           )
         "
       >
         BOX ${b+1}
         ／ ${empty+1}番
       </button>
     `;

   }

 }

 html+=`
   <button

     style="width:100%"

   </button>
 `;

}

function partyToBox(partyIndex,boxIndex,slot){

 const mon=
   state.party[partyIndex];

 state.boxes[boxIndex][slot]=mon;

 state.party.splice(partyIndex,1);

 closeModal();

 closeOverlays();

 setMessage(

 );

}

/* =========================================================
   戦闘開始
========================================================= */

function startWildBattle(){

 const alive=
   firstAlive();

 if(alive<0){

   healParty();

   setMessage(
     "手持ちが全員ひんしだったため、回復しました。"
   );

   return;

 }

 let id;

 /*
   マップが進むほど強いパチモンが出る
 */

 const maxId=
   state.map>=6 ? 50 :
   state.map>=4 ? 42 :
   state.map>=2 ? 36 :
   30;

 do{

   id=
     Math.floor(
       Math.random()*maxId
     )+1;

 }while(
   id>50
 );

 const level=
   Math.max(
     3,
     Math.min(
       35,
       3+
       state.map*3+
       Math.floor(Math.random()*6)
     )
   );

 const enemy=
   createMonster(id,level);

 state.battle={

   enemy:enemy,

   playerIndex:alive,

   captured:false

 };

 addDex(id);

 showScreen("battleScreen");

 renderBattle();

 setBattleText(
   `野生の${getMonsterName(enemy)}が現れた！`
 );

}

/* =========================================================
   バトル描画
========================================================= */

function renderBattle(){

 const battle=state.battle;

 if(!battle) return;

 const enemy=battle.enemy;

 const player=
   state.party[battle.playerIndex];

 const enemyData=
   monsterData(enemy.id);

 const playerData=
   monsterData(player.id);

 document.getElementById("wildName")
   .textContent=enemyData.name;

 document.getElementById("wildLevel")
   .textContent=enemy.level;

 document.getElementById("wildHp")
   .textContent=Math.max(0,enemy.hp);

 document.getElementById("wildMaxHp")
   .textContent=enemy.maxHp;

 document.getElementById("wildHpFill")
   .style.width=
     `${clamp(enemy.hp/enemy.maxHp*100,0,100)}%`;

 document.getElementById("wildIcon")
   .textContent=enemyData.icon;

 document.getElementById("playerNameBattle")
   .textContent=playerData.name;

 document.getElementById("playerLevelBattle")
   .textContent=player.level;

 document.getElementById("playerHpBattle")

 document.getElementById("playerMaxHpBattle")
   .textContent=player.maxHp;

 document.getElementById("playerHpFill")

}

/* =========================================================
   技使用
========================================================= */

function useMove(moveIndex){

 closeModal();

 const battle=state.battle;

 if(!battle) return;

 const player=
   state.party[battle.playerIndex];

 const enemy=
   battle.enemy;

 const move=
   MOVES[moveIndex];

 let damage=
   move.power+
   player.atk+
   Math.floor(Math.random()*6);

 enemy.hp=
   Math.max(
     0,
     enemy.hp-damage
   );

 setBattleText(
   `${getMonsterName(player)}の「${move.name}」！ ${damage}ダメージ！`
 );

 renderBattle();

 if(enemy.hp<=0){

   setTimeout(()=>{
     winBattle();
   },700);

   return;

 }

 setTimeout(()=>{
   enemyAttack();
 },700);

}

/* =========================================================
   敵攻撃
========================================================= */

function enemyAttack(){

 const battle=state.battle;

 if(!battle) return;

 const player=
   state.party[battle.playerIndex];

 const enemy=
   battle.enemy;

 const damage=
   enemy.atk+
   Math.floor(Math.random()*5);

 player.hp=
   Math.max(
     0,
     player.hp-damage
   );

 setBattleText(
   `野生の${getMonsterName(enemy)}の攻撃！ ${damage}ダメージ！`
 );

 renderBattle();

 if(player.hp<=0){

   setTimeout(()=>{
     playerDefeated();
   },700);

 }

}

/* =========================================================
   勝利
========================================================= */

function winBattle(){

 const battle=state.battle;

 const enemy=battle.enemy;

 const player=
   state.party[battle.playerIndex];

 const money=
   50+
   enemy.level*15+
   Math.floor(Math.random()*50);

 const exp=
   35+
   enemy.level*8;

 state.money+=money;

 player.exp+=exp;

 const reward=
   getBattleDrop(enemy);

 let text=
   `${getMonsterName(enemy)}を倒した！<br>`+
   `${exp}EXP獲得！<br>`+
   `💰 ${money}円を手に入れた！`;

 if(reward){

   state.items[reward]=
     (state.items[reward]||0)+1;

   text+=
     `<br>🎁 ${ITEMS[reward].name}を手に入れた！`;

 }

 checkLevelUp(player);

 setBattleText(text);

 renderBattle();

 setTimeout(()=>{

   state.battle=null;

   showScreen("mapScreen");

   renderAll();

   setMessage(
     `${getMonsterName(player)}は戦闘に勝利した！`
   );

 },1400);

}

/* =========================================================
   ドロップアイテム
========================================================= */

function getBattleDrop(enemy){

 const r=Math.random();

 if(r<0.10){
   return "hyperCapsule";
 }

 if(r<0.25){
   return "superCapsule";
 }

 if(r<0.50){
   return "capsule";
 }

 if(r<0.75){
   return "potion";
 }

 if(r<0.85){
   return "superPotion";
 }

 return null;

}

/* =========================================================
   レベルアップ・進化
========================================================= */

function checkLevelUp(mon){

 while(mon.exp>=100){

   mon.exp-=100;

   mon.level++;

   mon.maxHp+=3;

   mon.hp=mon.maxHp;

   mon.atk+=2;

   const d=
     monsterData(mon.id);

   if(
     d.evo &&
     mon.level>=d.evoLv
   ){

     const oldName=d.name;

     const newId=d.evo;

     const newData=
       monsterData(newId);

     mon.id=newId;

     /*
       進化後の能力を少し強化
    */

     mon.maxHp=
       Math.max(
         mon.maxHp,
         newData.baseHp+
         Math.floor((mon.level-1)*2.5)
       );

     mon.atk=
       Math.max(
         mon.atk,
         newData.atk+
         Math.floor((mon.level-1)*1.3)
       );

     mon.hp=mon.maxHp;

     addDex(newId);

     setTimeout(()=>{

       showEvolutionMessage(
         oldName,
         newData.name
       );

     },300);

   }

 }

}

 openModal(`

     <br>

   </button>

 `);

}

========================================================= */

function playerDefeated(){

 setBattleText(
   `${getMonsterName(state.party[state.battle.playerIndex])}は倒れた！`
 );

 );

}

 let html=`
   <h2>🎒 どうぐ</h2>
 `;

/* =========================================================
   回復アイテム
========================================================= */

function usePotion(type){

 if(state.items[type]<=0) return;

 const player=
   state.party[state.battle.playerIndex];

 if(player.hp<=0){

   alert("ひんし状態では使えません。");

   return;

 }

 if(player.hp>=player.maxHp){

   alert("HPは満タンです。");

   return;

 }

 const item=ITEMS[type];

 state.items[type]--;

 const before=player.hp;

 player.hp=
   Math.min(
     player.maxHp,
     player.hp+item.heal
   );

 const heal=
   player.hp-before;

 closeModal();

 setBattleText(
   `${item.name}を使った！ HPが${heal}回復した！`
 );

 renderBattle();

 setTimeout(()=>{
   enemyAttack();
 },600);

}

/* =========================================================
   捕獲
========================================================= */

function useCapsule(type){

 if(state.items[type]<=0) return;

 const battle=state.battle;

 const enemy=battle.enemy;

 const player=
   state.party[battle.playerIndex];

 if(state.party.length>=4){

   alert(
     "手持ちが4匹なので捕まえられません。BOXに送る機能は次回のボタンから対応できます。"
   );

   return;

 }

 state.items[type]--;

 const item=ITEMS[type];

 /*
   HPが低いほど捕獲しやすい
 */

 const hpFactor=
   1-
   enemy.hp/enemy.maxHp;

 const chance=
   clamp(
     0.12+
     hpFactor*0.65+
     item.rate*0.12,
     0.05,
     0.90
   );

 if(Math.random()<chance){

   state.party.push(enemy);

   addDex(enemy.id);

   closeModal();

   setBattleText(
     `${item.name}が揺れて……`
   );

   renderBattle();

   setTimeout(()=>{

     setBattleText(
       `${getMonsterName(enemy)}を捕まえた！`
     );

   },500);

   setTimeout(()=>{

     state.battle=null;

     showScreen("mapScreen");

     renderAll();

     setMessage(
       `${getMonsterName(enemy)}が仲間になりました！`
     );

   },1300);

 }else{

   closeModal();

   setBattleText(
     `${item.name}から飛び出してしまった！`
   );

   renderBattle();

   setTimeout(()=>{
     enemyAttack();
   },700);

 }

}

/* =========================================================
   セーブ
========================================================= */

function saveGame(showMessage=true){

 try{

   localStorage.setItem(
     "pachimonsave",
     JSON.stringify(state)
   );

   if(showMessage){

     alert("セーブしました！");

   }

 }catch(e){

   alert("セーブに失敗しました。");

 }

}

/* =========================================================
   ロード
========================================================= */

function loadGame(){

 try{

   const saved=
     localStorage.getItem("pachimonsave");

   if(!saved) return false;

   const data=
     JSON.parse(saved);

   state=data;

   /*
     古いセーブデータ対策
   */

   if(!state.boxes){

     state.boxes=
       Array.from(
         {length:5},
         ()=>Array(20).fill(null)
       );

   }

   if(!state.items){

     state.items={
       potion:5,
       superPotion:0,
       capsule:5,
       superCapsule:2,
       hyperCapsule:1
     };

   }

   if(!state.dex){
     state.dex=[];
   }

   return true;

 }catch(e){

   return false;

 }

}

   リセット
========================================================= */

function resetGame(){

 const ok=
   confirm(
     "リセットしますか？\nセーブデータも削除されます。"
   );

 if(!ok) return;

 localStorage.removeItem(
   "pachimonsave"
 );

 location.reload();

}
